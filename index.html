<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Security Center</title>

    <!-- TAMBAHKAN 2 BARIS INI FOR PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        .btn-sub { background: #28a745; color: white; }
        .btn-unsub { background: #6c757d; color: white; }
        .btn-ble { background: #007bff; color: white; }
        .btn-adapt { background: #ffc107; color: black; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-clear { background: #343a40; color: white; font-size: 12px; padding: 6px; width: auto; float: right; margin-bottom: 5px; }
        input { width: 90%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: white; text-align: center; }
        .status { margin-top: 10px; font-weight: bold; color: #17a2b8; font-size: 14px; }
        .badge { display: inline-block; background: #28a745; color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 10px; margin-bottom: 10px; }
        
        /* Style untuk Terminal Log */
        .terminal-card { max-width: 450px; text-align: left; }
        .terminal { background: #000; color: #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 12px; padding: 10px; border-radius: 6px; height: 180px; overflow-y: auto; border: 1px solid #333; white-space: pre-wrap; word-break: break-all; }
        .terminal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    </style>
</head>
<body>

    <h2>🚨 ESP32 Security Center</h2>
    <div class="badge">Connected via Wi-Fi & Server</div>

    <!-- Section 1: Push Notification Subscription -->
    <div class="card">
        <h3>🔔 Target Device Notification</h3>
        <button class="btn-sub" onclick="subscribePush()">🔔 Subscribe Notifikasi HP Ini</button>
        <button class="btn-unsub" onclick="unsubscribePush()">🔕 Unsubscribe Notifikasi HP Ini</button>
        <div id="push-status" class="status">Status Push: Menunggu Aksi...</div>
    </div>

    <!-- Section 2: Bluetooth Setup (Hanya untuk kirim Wi-Fi awal) -->
    <div class="card">
        <h3>📶 Wi-Fi Provisioning via BLE</h3>
        <input type="text" id="ssid" placeholder="Nama Wi-Fi (SSID)">
        <input type="password" id="password" placeholder="Password Wi-Fi">
        <button class="btn-ble" onclick="connectBLEAndSendWifi()">📡 Connect BLE & Kirim Wi-Fi</button>
        <div id="ble-status" class="status">BLE Disconnected</div>
    </div>

    <!-- Section 3: Adaptation & Control via Server -->
    <div class="card">
        <h3>🛡️ Kontrol Monitoring System</h3>
        <button class="btn-adapt" onclick="sendCommand('ADAPT')">🔄 Adaptasi Data & Train Model</button>
        <button class="btn-start" onclick="sendCommand('START')">🛡️ Nyalakan Sistem (Arm)</button>
        <button class="btn-stop" onclick="sendCommand('STOP')">🛑 Matikan Sistem (Disarm)</button>
        <div id="system-status" class="status">Status: IDLE</div>
    </div>

    <!-- Section 4: Live Terminal Log ESP32 (via Server Polling) -->
    <div class="card terminal-card">
        <div class="terminal-header">
            <strong>💻 Live Terminal Log (Wi-Fi)</strong>
            <button class="btn-clear" onclick="clearTerminal()">Clear</button>
        </div>
        <div id="terminal-box" class="terminal">[System] Menunggu log dari ESP32 via server...</div>
    </div>

    <script>
        const SERVER_URL = "https://uninured-centrifugally-marjorie.ngrok-free.app";
        const BLE_SVC_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const BLE_RX_UUID  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        const NGROK_HEADERS = {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
        };

        let bleDevice = null;
        let bleRxCharacteristic = null;

        // --- FUNGSI LOGGER KE TERMINAL PWA ---
        function appendLocalLog(message) {
            const term = document.getElementById('terminal-box');
            const timestamp = new Date().toLocaleTimeString();
            term.innerText += `\n[${timestamp}] ${message}`;
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal-box').innerText = "[System] Terminal dibersihkan.";
        }

        // --- POLLING LOG DARI SERVER SETIAP 1.5 DETIK ---
        setInterval(async () => {
            try {
                const res = await fetch(`${SERVER_URL}/api/get_logs`, { headers: NGROK_HEADERS });
                const data = await res.json();
                if (data.logs && data.logs.length > 0) {
                    const term = document.getElementById('terminal-box');
                    term.innerText = data.logs.join("\n");
                    term.scrollTop = term.scrollHeight;
                }
            } catch (e) {
                // Abaikan jika jaringan terputus sementara
            }
        }, 1500);

        // --- REGISTRASI SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                    checkCurrentSubscription();
                } catch (err) {
                    appendLocalLog("Gagal Registrasi SW: " + err);
                }
            });
        }

        async function checkCurrentSubscription() {
            const statusDiv = document.getElementById('push-status');
            if (!('serviceWorker' in navigator)) return;
            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (sub) {
                    statusDiv.innerText = "✅ HP Ini Sudah Terdaftar (Subscribed)";
                    statusDiv.style.color = "#28a745";
                } else {
                    statusDiv.innerText = "Status Push: Belum Terdaftar";
                    statusDiv.style.color = "#17a2b8";
                }
            } catch (e) {
                appendLocalLog("Check sub error: " + e);
            }
        }

        // --- SUBSCRIBE PUSH NOTIFICATION ---
        async function subscribePush() {
            const statusDiv = document.getElementById('push-status');
            statusDiv.innerText = "⏳ Mendaftarkan...";
            statusDiv.style.color = "#ffc107";

            try {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') {
                    alert("Izin notifikasi ditolak!");
                    statusDiv.innerText = "❌ Izin Ditolak";
                    statusDiv.style.color = "#dc3545";
                    return;
                }

                const reg = await navigator.serviceWorker.ready;
                const keyRes = await fetch(`${SERVER_URL}/api/vapid_public_key`, { headers: NGROK_HEADERS });
                const keyData = await keyRes.json();

                if (!keyData.public_key) throw new Error("VAPID Public Key tidak ditemukan");

                const convertedKey = urlBase64ToUint8Array(keyData.public_key);

                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedKey
                    });
                }

                await fetch(`${SERVER_URL}/api/subscribe`, {
                    method: 'POST',
                    headers: NGROK_HEADERS,
                    body: JSON.stringify(sub)
                });

                statusDiv.innerText = "✅ HP Berhasil Terdaftar Notifikasi!";
                statusDiv.style.color = "#28a745";
            } catch (err) {
                appendLocalLog("Gagal Subscribe: " + err.message);
                statusDiv.innerText = "❌ Gagal Subscribe";
                statusDiv.style.color = "#dc3545";
            }
        }

        // --- UNSUBSCRIBE PUSH NOTIFICATION ---
        async function unsubscribePush() {
            const statusDiv = document.getElementById('push-status');
            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();

                if (sub) {
                    await fetch(`${SERVER_URL}/api/unsubscribe`, {
                        method: 'POST',
                        headers: NGROK_HEADERS,
                        body: JSON.stringify(sub)
                    });
                    await sub.unsubscribe();
                }

                statusDiv.innerText = "🔕 Berhasil Unsubscribe!";
                statusDiv.style.color = "#6c757d";
            } catch (err) {
                appendLocalLog("Gagal Unsubscribe: " + err.message);
            }
        }

        // --- KONEKSI BLE UNTUK KIRIM WI-FI AWAL ---
        async function connectBLEAndSendWifi() {
            const ssid = document.getElementById('ssid').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusDiv = document.getElementById('ble-status');

            if (!ssid) return alert("Isi SSID Wi-Fi terlebih dahulu!");

            try {
                statusDiv.innerText = "Mencari & Menghubungkan BLE...";
                statusDiv.style.color = "#ffc107";

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_Maling_Detector' }],
                    optionalServices: [BLE_SVC_UUID]
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(BLE_SVC_UUID);
                bleRxCharacteristic = await service.getCharacteristic(BLE_RX_UUID);

                const payload = JSON.stringify({ ssid: ssid, pass: password });
                statusDiv.innerText = "Mengirim Kredensial Wi-Fi...";

                // Kirim data secara chunk (aman dari limit MTU)
                const CHUNK_SIZE = 15;
                const encoder = new TextEncoder();
                const dataBytes = encoder.encode(payload);

                for (let i = 0; i < dataBytes.length; i += CHUNK_SIZE) {
                    const chunk = dataBytes.slice(i, i + CHUNK_SIZE);
                    await bleRxCharacteristic.writeValue(chunk);
                    await new Promise(resolve => setTimeout(resolve, 50));
                }

                statusDiv.innerText = "✅ Kredensial Wi-Fi Terkirim!";
                statusDiv.style.color = "#28a745";
                appendLocalLog("✅ Kredensial Wi-Fi dikirim via BLE. ESP32 akan beralih ke Wi-Fi.");
            } catch (err) {
                appendLocalLog("BLE Error: " + err);
                statusDiv.innerText = "❌ Gagal Kirim Wi-Fi";
                statusDiv.style.color = "#dc3545";
            }
        }

        // --- KONTROL SISTEM VIA SERVER ---
        async function sendCommand(cmd) {
            const statusDiv = document.getElementById('system-status');
            statusDiv.innerText = `⏳ Memproses perintah ${cmd}...`;
            statusDiv.style.color = "#ffc107";

            try {
                const res = await fetch(`${SERVER_URL}/api/set_command`, {
                    method: 'POST',
                    headers: NGROK_HEADERS,
                    body: JSON.stringify({ command: cmd })
                });
                const resData = await res.json();

                if (resData.status === "OK") {
                    statusDiv.innerText = `✅ Perintah ${cmd} Berhasil Dikirim!`;
                    statusDiv.style.color = "#28a745";
                    appendLocalLog(`🎮 Command [${cmd}] dikirim ke server.`);
                } else {
                    throw new Error("Respon Server Gagal");
                }
            } catch (err) {
                statusDiv.innerText = `❌ Gagal Kirim Command (${cmd})`;
                statusDiv.style.color = "#dc3545";
                appendLocalLog(`❌ Gagal kirim command: ${err}`);
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
