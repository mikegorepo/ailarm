<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Security Center Debug</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; }
        h2, h3 { text-align: center; margin-top: 5px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-sub { background: #28a745; color: white; }
        .btn-unsub { background: #6c757d; color: white; }
        .btn-test { background: #17a2b8; color: white; }
        .status { margin-top: 10px; font-weight: bold; color: #17a2b8; font-size: 14px; text-align: center; }
        
        /* Box Terminal Debug Log */
        #log-box { 
            background: #000; 
            color: #00ff00; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 12px; 
            border-radius: 8px; 
            max-height: 250px; 
            overflow-y: auto; 
            font-size: 12px; 
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-top: 15px;
        }
        .log-err { color: #ff4d4d; }
        .log-succ { color: #5cdb95; }
        .log-warn { color: #ffcc00; }
    </style>
</head>
<body>

    <h2>🚨 ESP32 Security Center Debug</h2>

    <div class="card">
        <h3>🔔 Target Device Notification</h3>
        <button class="btn-sub" onclick="subscribePush()">🔔 Subscribe Notifikasi Device Ini</button>
        <button class="btn-unsub" onclick="unsubscribePush()">🔕 Unsubscribe Notifikasi Device Ini</button>
        <button class="btn-test" onclick="checkEnvironment()">🔍 Cek Environment / Fitur Browser</button>
        <div id="push-status" class="status">Status Push: Ready for Debugging</div>
    </div>

    <!-- Live Console Debug Box -->
    <div class="card">
        <h3>📜 Live Console Log</h3>
        <button style="background:#444; color:#fff; padding:6px; font-size:12px;" onclick="clearLog()">Clear Log</button>
        <div id="log-box">▶ Status Log Aktif. Klik "Subscribe" untuk mulai debug...\n</div>
    </div>

    <script>
        const SERVER_URL = "https://uninured-centrifugally-marjorie.ngrok-free.app";
        const NGROK_HEADERS = {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
        };

        // --- CUSTOM LOGGER SYSTEM ---
        function log(msg, type = 'info') {
            const logBox = document.getElementById('log-box');
            const time = new Date().toLocaleTimeString();
            let prefix = "ℹ️ [INFO]";
            let cssClass = "";

            if (type === 'error') { prefix = "❌ [ERROR]"; cssClass = "log-err"; }
            if (type === 'success') { prefix = "✅ [SUCCESS]"; cssClass = "log-succ"; }
            if (type === 'warn') { prefix = "⚠️ [WARN]"; cssClass = "log-warn"; }

            const formattedMsg = `[${time}] ${prefix} ${msg}\n`;
            console.log(formattedMsg);
            
            logBox.innerHTML += `<span class="${cssClass}">${formattedMsg}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log-box').innerHTML = "▶ Log cleared.\n";
        }

        // --- CHECK ENVIRONMENT ---
        function checkEnvironment() {
            log("Memeriksa fitur browser...");
            log(`Location Protocol: ${window.location.protocol}`);
            log(`Is Secure Context (HTTPS): ${window.isSecureContext}`);
            log(`ServiceWorker Support: ${'serviceWorker' in navigator}`);
            log(`PushManager Support: ${'PushManager' in window}`);
            log(`Notification Support: ${'Notification' in window}`);
            
            if ('Notification' in window) {
                log(`Permission Notifikasi Saat Ini: ${Notification.permission}`, Notification.permission === 'granted' ? 'success' : 'warn');
            }
        }

        // --- SUBSCRIBE PUSH FUNCTION ---
        async function subscribePush() {
            const statusDiv = document.getElementById('push-status');
            log("--- PROSES SUBSCRIBE DIMULAI ---");

            try {
                // Step 1: Cek Dukungan Browser
                if (!('serviceWorker' in navigator)) {
                    throw new Error("Browser ini TIDAK mendukung Service Worker!");
                }
                if (!('PushManager' in window)) {
                    throw new Error("Browser ini TIDAK mendukung Push API!");
                }

                // Step 2: Cek & Minta Izin Notifikasi
                log("Meminta izin Notifikasi dari pengguna...");
                const perm = await Notification.requestPermission();
                log(`Izin Notifikasi Diberikan: ${perm}`, perm === 'granted' ? 'success' : 'warn');

                if (perm !== 'granted') {
                    throw new Error("Izin Notifikasi ditolak oleh pengguna atau di-block browser.");
                }

                // Step 3: Register / Check Service Worker
                log("Menunggu Service Worker Siap (navigator.serviceWorker.ready)...");
                
                // Set Timeout 5 Detik untuk mendeteksi SW yang menggantung (stuck)
                const swTimeout = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error("Timeout: Service Worker tidak kunjung 'ready'. Apakah file 'sw.js' terdaftar dan aktif?")), 5000)
                );

                const reg = await Promise.race([navigator.serviceWorker.ready, swTimeout]);
                log(`Service Worker Siap! Active Scope: ${reg.scope}`, 'success');

                // Step 4: Fetch VAPID Public Key dari Server
                log(`Fetching VAPID Public Key dari: ${SERVER_URL}/api/vapid_public_key`);
                const keyRes = await fetch(`${SERVER_URL}/api/vapid_public_key`, { headers: NGROK_HEADERS });
                
                if (!keyRes.ok) {
                    throw new Error(`Server merespon HTTP Error Status: ${keyRes.status}`);
                }

                const keyData = await keyRes.json();
                log(`VAPID Public Key Diterima: ${keyData.public_key ? keyData.public_key.substring(0, 15) + '...' : 'NULL'}`, 'success');

                if (!keyData.public_key) {
                    throw new Error("Server mengirim JSON tetapi key 'public_key' kosong/null!");
                }

                // Step 5: Convert Base64 Key ke Uint8Array
                log("Mengonversi VAPID Key ke Uint8Array...");
                const convertedKey = urlBase64ToUint8Array(keyData.public_key);
                log(`Key Berhasil Di-convert! Array Length: ${convertedKey.length} bytes`, 'success');

                // Step 6: Subscribe via PushManager
                log("Memanggil reg.pushManager.subscribe()...");
                
                let sub = await reg.pushManager.getSubscription();
                if (sub) {
                    log("Device sudah terdaftar sebelumnya di browser ini.", 'warn');
                } else {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedKey
                    });
                    log("Push Subscription Baru Berhasil Dibuat oleh Browser!", 'success');
                }

                // Step 7: Kirim Data Subscription ke Server Python
                log("Mengirim data Subscription ke Server (/api/subscribe)...");
                const subRes = await fetch(`${SERVER_URL}/api/subscribe`, {
                    method: 'POST',
                    headers: NGROK_HEADERS,
                    body: JSON.stringify(sub)
                });

                const subResData = await subRes.json();
                log(`Respon Server: ${JSON.stringify(subResData)}`, 'success');

                statusDiv.innerText = "✅ HP/Device Berhasil Terdaftar (Subscribed)!";
                statusDiv.style.color = "#28a745";
                log("--- PROSES SUBSCRIBE SELESAI DENGAN SUKSES ---", 'success');

            } catch (err) {
                log(`ALUR TERHENTI: ${err.message}`, 'error');
                if (err.stack) console.error("Stack Trace:", err.stack);
                
                statusDiv.innerText = `❌ Gagal: ${err.message}`;
                statusDiv.style.color = "#dc3545";
            }
        }

        // --- UNSUBSCRIBE PUSH FUNCTION ---
        async function unsubscribePush() {
            const statusDiv = document.getElementById('push-status');
            log("--- PROSES UNSUBSCRIBE DIMULAI ---");

            try {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                
                if (sub) {
                    log("Mengirim permintaan hapus subscription ke Server...");
                    await fetch(`${SERVER_URL}/api/unsubscribe`, {
                        method: 'POST',
                        headers: NGROK_HEADERS,
                        body: JSON.stringify(sub)
                    });

                    log("Membatalkan subscription di Browser...");
                    await sub.unsubscribe();
                    log("Subscription berhasil dibatalkan!", 'success');
                } else {
                    log("Tidak ada subscription aktif untuk dibatalkan.", 'warn');
                }

                statusDiv.innerText = "🔕 Device Berhasil Unsubscribe!";
                statusDiv.style.color = "#6c757d";
            } catch (err) {
                log(`Unsubscribe Error: ${err.message}`, 'error');
            }
        }

        // --- HELPER CONVERTER BASE64 TO UINT8ARRAY ---
        function urlBase64ToUint8Array(base64String) {
            try {
                const padding = '='.repeat((4 - base64String.length % 4) % 4);
                const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
                const rawData = window.atob(base64);
                const outputArray = new Uint8Array(rawData.length);
                for (let i = 0; i < rawData.length; ++i) {
                    outputArray[i] = rawData.charCodeAt(i);
                }
                return outputArray;
            } catch (e) {
                throw new Error(`Format VAPID Key Tidak Valid (Base64 Decode Error): ${e.message}`);
            }
        }

        // Inisialisasi Otomatis Saat Page Load
        window.addEventListener('DOMContentLoaded', () => {
            checkEnvironment();
        });
    </script>
</body>
</html>
